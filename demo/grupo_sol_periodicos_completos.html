  const DUMMY_ARTICLES = [
  // ... Deja los 4 artículos que ya tenías ...
  { id: 1, title: "Nueva inversión tecnológica impulsará el desarrollo en el sureste", excerpt: "Se espera la creación de más de 10,000 empleos directos en la región gracias al nuevo parque tecnológico.", content: "En un anuncio sin precedentes, autoridades y líderes empresariales confirmaron la inyección de capital para el desarrollo tecnológico del sureste mexicano. Este proyecto no solo busca modernizar la infraestructura actual, sino también posicionar a la región como un hub de innovación a nivel internacional.\n\nEl proyecto contempla la construcción de centros de datos, áreas de investigación y desarrollo, y espacios para startups locales. Se espera que las primeras fases del proyecto concluyan en los próximos 18 meses, marcando el inicio de una nueva era económica para los estados involucrados.", category: "Nacional", newspaper: "Sol Quintana Roo", date: "Hace 2 horas", author: "Redacción Especial", readTime: "3 min de lectura", imageUrl: "https://images.unsplash.com/photo-1518770660439-4636190af475?auto=format&fit=crop&q=80&w=800&h=400", isBreaking: true },
  { id: 2, title: "Histórico hallazgo arqueológico en la península", excerpt: "Investigadores descubren una antigua estructura que podría cambiar lo que sabemos sobre las rutas comerciales precolombinas.", content: "Un equipo multidisciplinario de arqueólogos ha revelado los detalles de su más reciente descubrimiento. Tras meses de excavaciones cuidadosas, han desenterrado los cimientos de lo que parece ser un importante centro de intercambio comercial.\n\nLas piezas cerámicas y herramientas encontradas sugieren que este sitio sirvió como punto de encuentro para diversas culturas, facilitando no solo el comercio de bienes, sino también el intercambio de conocimientos y tradiciones.", category: "Local", newspaper: "Sol Yucatán", date: "Hace 4 horas", author: "María Fernández", readTime: "5 min de lectura", imageUrl: "https://images.unsplash.com/photo-1599940824399-b87987ceb72a?auto=format&fit=crop&q=80&w=800&h=400", isBreaking: false },

  // Agrega estos nuevos:
  { id: 5, title: "Operativo especial logra disminuir la incidencia delictiva", excerpt: "Las fuerzas de seguridad reportan un saldo blanco tras el despliegue del fin de semana.", content: "En una rueda de prensa matutina, el secretario de seguridad informó que los operativos conjuntos han logrado reducir significativamente los incidentes delictivos en la región.\n\nSe mantendrán las patrullas en zonas clave para asegurar la tranquilidad de los ciudadanos.", category: "Local", newspaper: "Sol Quintana Roo", date: "Hace 1 hora", author: "Redacción Especial", readTime: "2 min de lectura", imageUrl: "https://images.unsplash.com/photo-1583422409516-2ea876fb0821?auto=format&fit=crop&q=80&w=800&h=400", isBreaking: true },
  { id: 6, title: "Lanzan nueva aplicación móvil para transporte público", excerpt: "Los usuarios podrán rastrear sus rutas en tiempo real.", content: "Una startup local ha lanzado hoy la esperada aplicación móvil que promete revolucionar la forma en que los ciudadanos utilizan el transporte público.\n\nCon tecnología GPS y actualizaciones en vivo, se espera reducir los tiempos de espera.", category: "Nacional", newspaper: "Sol Yucatán", date: "Hace 6 horas", author: "Ana Torres", readTime: "4 min de lectura", imageUrl: "https://images.unsplash.com/photo-1512314889357-e157c22f938d?auto=format&fit=crop&q=80&w=800&h=400", isBreaking: false },

  { id: 9, title: "Mérida prepara nuevos espacios públicos para la comunidad", excerpt: "El proyecto contempla áreas verdes, movilidad peatonal y actividades culturales.", content: "Autoridades locales presentaron un proyecto para recuperar espacios públicos y ampliar las áreas de convivencia comunitaria. La propuesta contempla zonas verdes, recorridos peatonales y espacios para actividades culturales.\n\nEl calendario de trabajos será publicado conforme avance la planeación del proyecto.", category: "Local", newspaper: "Sol Yucatán", date: "Hace 3 horas", author: "Redacción Local", readTime: "3 min de lectura", imageUrl: "https://images.unsplash.com/photo-1449824913935-59a10b8d2000?auto=format&fit=crop&q=80&w=800&h=400", isBreaking: false },
  { id: 10, title: "México fortalece su presencia en nuevos mercados", excerpt: "Empresas mexicanas exploran oportunidades de colaboración internacional.", content: "Representantes empresariales anunciaron nuevas reuniones de trabajo para explorar oportunidades comerciales en distintos mercados. Las conversaciones incluyen cooperación tecnológica, logística y manufactura.\n\nLos acuerdos deberán pasar por las etapas de evaluación y formalización correspondientes.", category: "Internacional", newspaper: "La Opinión de México", date: "Hace 7 horas", author: "Mesa de Redacción", readTime: "4 min de lectura", imageUrl: "https://images.unsplash.com/photo-1521295121783-8a321d551ad2?auto=format&fit=crop&q=80&w=800&h=400", isBreaking: false },
  { id: 11, title: "Artistas regionales anuncian una nueva cartelera cultural", excerpt: "La programación reunirá música, teatro y propuestas audiovisuales.", content: "La agenda cultural de la región sumará nuevas presentaciones de artistas y colectivos independientes. La programación incluye conciertos, funciones teatrales y muestras audiovisuales.\n\nLos organizadores invitaron a la ciudadanía a consultar los horarios y sedes oficiales.", category: "Espectáculos", newspaper: "Sol Campeche", date: "Ayer", author: "Cultura y Espectáculos", readTime: "3 min de lectura", imageUrl: "https://images.unsplash.com/photo-1492684223066-81342ee5ff30?auto=format&fit=crop&q=80&w=800&h=400", isBreaking: false },
  { id: 12, title: "Especialistas analizan los retos de la transformación digital", excerpt: "La adopción tecnológica exige capacitación y estrategias de seguridad.", content: "Especialistas del sector tecnológico compartieron recomendaciones para que las organizaciones adopten herramientas digitales de forma gradual. Entre los temas abordados destacan la capacitación del personal, la protección de datos y la continuidad operativa.\n\nLa transformación digital requiere objetivos claros y una evaluación constante de resultados.", category: "Nacional", newspaper: "Sol Quintana Roo", date: "Hace 8 horas", author: "Redacción Tecnología", readTime: "5 min de lectura", imageUrl: "https://images.unsplash.com/photo-1516321318423-f06f85e504b3?auto=format&fit=crop&q=80&w=800&h=400", isBreaking: false },
  { id: 13, title: "La jornada deportiva reúne a jóvenes de la península", excerpt: "La competencia promueve la actividad física y la convivencia.", content: "Una jornada deportiva reunió a jóvenes de distintos municipios en una serie de encuentros amistosos. Los organizadores señalaron que el objetivo principal es promover hábitos saludables y fortalecer la convivencia.\n\nLas actividades continuarán durante las próximas semanas con nuevas disciplinas.", category: "Deportes", newspaper: "Sol Yucatán", date: "Hace 10 horas", author: "Deportes GS", readTime: "2 min de lectura", imageUrl: "https://images.unsplash.com/photo-1461896836934-ffe607ba8211?auto=format&fit=crop&q=80&w=800&h=400", isBreaking: false }

    function getArticleTimestamp(article) {
      // Los artículos que ya tienen publishedAt usan una fecha real.
      if (article.publishedAt) {
        const timestamp = new Date(article.publishedAt).getTime();
        if (!Number.isNaN(timestamp)) return timestamp;
      }

      // Compatibilidad con artículos antiguos que solo tienen "date".
      // No inventamos una fecha exacta: solo reconocemos expresiones relativas.
      const value = String(article.date || '').toLowerCase();
      const now = Date.now();

      const hours = value.match(/(?:hace|ago)\\s+(\\d+)\\s*(?:horas?|hours?)/);
      if (hours) return now - Number(hours[1]) * 60 * 60 * 1000;

      const days = value.match(/(?:hace|ago)\\s+(\\d+)\\s*(?:d[ií]as?|days?)/);
      if (days) return now - Number(days[1]) * 24 * 60 * 60 * 1000;

      if (value.includes('ayer')) return now - 24 * 60 * 60 * 1000;

      return null;
    }

    function articleMatchesSearch(article) {
      const query = String(state.searchQuery || '').toLowerCase().trim();
      const section = String(state.searchSection || '').toLowerCase().trim();
      const author = String(state.searchAuthor || '').toLowerCase().trim();
      const dateFilter = state.searchDate || '';

      const searchableText = [
        article.title,
        article.excerpt,
        article.content,
        article.author,
        article.category,
        article.newspaper
      ].filter(Boolean).join(' ').toLowerCase();

      if (query && !searchableText.includes(query)) return false;

      if (
        section &&
        section !== 'all' &&
        String(article.category || '').toLowerCase() !== section
      ) {
        return false;
      }

      if (
        author &&
        !String(article.author || '').toLowerCase().includes(author)
      ) {
        return false;
      }

      if (dateFilter && dateFilter !== 'all') {
        const timestamp = getArticleTimestamp(article);

        // Si el artículo no tiene fecha interpretable, no lo incluimos
        // cuando el usuario solicitó un filtro temporal.
        if (timestamp === null) return false;

        const age = Date.now() - timestamp;

        if (dateFilter === '24h' && age > 24 * 60 * 60 * 1000) return false;
        if (dateFilter === 'week' && age > 7 * 24 * 60 * 60 * 1000) return false;
        if (dateFilter === 'month' && age > 30 * 24 * 60 * 60 * 1000) return false;
      }

      return true;
    }

    function renderArticle() {
  const article = state.activeArticle;
  if (!article) return '';
  const isSaved = state.savedArticles.some(a => a.id === article.id);

  // Variables dinámicas para los tamaños
  let fontSizeClass = 'text-base leading-relaxed';
  let titleSizeClass = 'text-2xl sm:text-3xl';
  let excerptSizeClass = 'text-base';

  if(state.fontSize === 'small') {
    fontSizeClass = 'text-sm leading-relaxed';
    titleSizeClass = 'text-xl sm:text-2xl';
    excerptSizeClass = 'text-sm';
  } else if(state.fontSize === 'large') {
    fontSizeClass = 'text-xl leading-loose';
    titleSizeClass = 'text-3xl sm:text-4xl';
    excerptSizeClass = 'text-lg';
  } else if(state.fontSize === 'xlarge') {
    fontSizeClass = 'text-2xl leading-loose';
    titleSizeClass = 'text-4xl sm:text-5xl';
    excerptSizeClass = 'text-xl';
  }

  const pars = article.content.split('\n\n').map(p => `<p class="mb-6">${p}</p>`).join('');

  return `
    <div class="flex flex-col h-full bg-white dark:bg-gray-900 transition-colors duration-300 overflow-y-auto no-scrollbar pb-24 relative">
      <div class="relative h-72 w-full flex-shrink-0">
        <img src="${article.imageUrl}" alt="Cover" class="w-full h-full object-cover" />
        <div class="absolute inset-0 bg-gradient-to-t from-black/90 via-black/30 to-black/30"></div>
        
        <div class="absolute top-0 left-0 right-0 pt-12 px-4 flex justify-between items-center z-10">
          <button onclick="window.goBack()" class="p-2 bg-black/40 backdrop-blur-md text-white rounded-full hover:bg-black/60 shadow-lg transition-colors">
            <i data-lucide="chevron-left" class="w-6 h-6"></i>
          </button>
          <div class="flex space-x-3">
            <!-- Botón de Tipografía (Icono 'A') -->
            <button type="button" onclick="window.openSettings(event)" class="p-2 bg-black/40 backdrop-blur-md text-white rounded-full hover:bg-black/60 shadow-lg transition-colors">
              <i data-lucide="type" class="w-5 h-5"></i>
            </button>
            <button onclick="window.toggleSave(${article.id})" class="p-2 backdrop-blur-md rounded-full shadow-lg transition-colors ${isSaved ? 'bg-orange-600 text-white' : 'bg-black/40 text-white'}">
              <i data-lucide="bookmark" class="w-5 h-5 ${isSaved ? 'fill-current' : ''}"></i>
            </button>
          </div>
        </div>
        <div class="absolute bottom-0 left-0 right-0 p-6 text-white">
          <span class="text-xs font-bold text-orange-400 uppercase tracking-widest mb-2 block">${article.category} • ${article.newspaper}</span>
          <h1 class="${titleSizeClass} font-serif font-bold leading-tight mb-2 text-shadow transition-all duration-300">${article.title}</h1>
        </div>
      </div>
      
      <div class="px-6 py-4 flex items-center justify-between border-b border-gray-100 dark:border-gray-800">
        <div class="flex items-center space-x-3">
          <div class="w-10 h-10 bg-gray-200 dark:bg-gray-700 rounded-full flex items-center justify-center">
            <i data-lucide="user" class="w-5 h-5 text-gray-500"></i>
          </div>
          <div>
            <p class="text-sm font-semibold text-gray-900 dark:text-white">${article.author}</p>
            <p class="text-xs text-gray-500 dark:text-gray-400">${article.date} • ${article.readTime}</p>
          </div>
        </div>
        <button class="p-2 text-gray-400 hover:text-orange-600"><i data-lucide="share-2" class="w-5 h-5"></i></button>
      </div>

      <div class="p-6 text-gray-800 dark:text-gray-200 font-serif ${fontSizeClass} transition-all duration-300">
        <p class="font-sans font-semibold text-gray-600 dark:text-gray-400 mb-6 italic border-l-4 border-orange-600 pl-4 ${excerptSizeClass} transition-all duration-300">${article.excerpt}</p>
        ${pars}
      </div>
    </div>
  `;
}

              <div class="relative z-10 text-white mt-8 flex flex-col items-center">
                ${getLogoHTML("mb-4", "text-white")}
                <h1 class="text-2xl font-serif font-bold">La información de México, contigo.</h1>
              </div>
           </div>
           <div class="p-8 -mt-6 bg-white dark:bg-gray-900 rounded-t-3xl relative z-20 text-gray-800 dark:text-gray-200 font-serif leading-relaxed text-lg">
             <p class="mb-6 drop-cap">somos un Corporativo Periodístico a nivel nacional y nos encontramos en los estados de: Yucatán, Quintana Roo, Campeche y en la Ciudad de México, de manera impresa y en el resto del país de manera digital.</p>
             <p class="mb-6">Fue fundado, por nuestro Director General Pedro Daniel Rodríguez Hernández, el 18 de noviembre del 2007, en la ciudad de Chetumal, Quintana Roo en su formato digital y 11 años después (en 2018) vio la luz como periódico impreso teniendo el objetivo de difundir nuestras investigaciones especiales sobre temas de corrupción, narcotráfico y el acontecer cotidiano.</p>
             <p class="font-bold text-orange-600 dark:text-orange-500 text-center text-xl mt-8">Desarrollando en el lector su capacidad crítica y analítica.</p>
           </div>
        </div>
      `;
    }

    // --- EXPLORE / VIDEOS / NEWSPAPER (restaurados) ---
    function renderExplore() {
      const articles = DUMMY_ARTICLES.filter(a => state.selectedTopics.length === 0 || state.selectedTopics.includes(a.category));
      return `
        <div class="flex flex-col h-full bg-gray-50 dark:bg-gray-900 overflow-y-auto pb-24 no-scrollbar">
          <div class="sticky top-0 z-20 bg-white dark:bg-gray-900 border-b border-gray-200 dark:border-gray-800 pt-12 pb-4 px-4">
            <h1 class="text-2xl font-serif font-bold text-gray-900 dark:text-white">Explorar</h1>
            <p class="text-sm text-gray-500 dark:text-gray-400 mt-1">Noticias por sección</p>
          </div>
          <div class="p-4">
            <div class="flex gap-2 overflow-x-auto no-scrollbar pb-4">
              <button onclick="window.setSelectedTopics([])" class="px-4 py-2 rounded-full text-xs font-semibold whitespace-nowrap ${state.selectedTopics.length === 0 ? 'bg-orange-600 text-white' : 'bg-white dark:bg-gray-800 text-gray-600 dark:text-gray-300'}">Todas</button>
              ${CATEGORIES.map(c => `<button onclick="window.setSelectedTopics(['${c.replace(/'/g, "\\'")}'])" class="px-4 py-2 rounded-full text-xs font-semibold whitespace-nowrap ${state.selectedTopics.includes(c) ? 'bg-orange-600 text-white' : 'bg-white dark:bg-gray-800 text-gray-600 dark:text-gray-300'}">${c}</button>`).join('')}
            </div>
            ${articles.length ? articles.map(a => getArticleCardHTML(a)).join('') : '<p class="text-sm text-gray-500">No hay noticias en esta sección.</p>'}

            <div class="mt-8">
              <div class="flex items-center justify-between mb-3">
                <h2 class="text-lg font-serif font-bold text-gray-900 dark:text-white">Otros periódicos</h2>
                <span class="text-xs text-gray-500 dark:text-gray-400">${NEWSPAPERS.length} medios</span>
              </div>
              <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">
                ${NEWSPAPERS.map(newspaper => `
                  <button onclick="window.navigate('newspaper', { newspaper: '${newspaper.replace(/'/g, "\\'")}' })"
                    class="w-full flex items-center justify-between gap-3 p-4 text-left bg-white dark:bg-gray-800 rounded-2xl border border-gray-100 dark:border-gray-700 shadow-sm hover:border-orange-300 dark:hover:border-orange-600 transition-colors">
                    <span class="font-semibold text-sm text-gray-800 dark:text-gray-100">${newspaper}</span>
                    <i data-lucide="chevron-right" class="w-4 h-4 flex-shrink-0 text-orange-600"></i>
                  </button>
                `).join('')}
              </div>
            </div>
          </div>
        </div>`;
    }

    function renderVideos() {
      return `
        <div class="flex flex-col h-full bg-gray-50 dark:bg-gray-900 overflow-y-auto pb-24 no-scrollbar">
          <div class="sticky top-0 z-20 bg-white dark:bg-gray-900 border-b border-gray-200 dark:border-gray-800 pt-12 pb-4 px-4">
            <h1 class="text-2xl font-serif font-bold text-gray-900 dark:text-white">Videos</h1>
            <p class="text-sm text-gray-500 dark:text-gray-400 mt-1">Contenido audiovisual de Grupo Sol</p>
          </div>
          <div class="p-4 space-y-4">
            ${DUMMY_VIDEOS.map(v => `<div class="bg-white dark:bg-gray-800 rounded-2xl overflow-hidden shadow-sm"><div class="relative"><img src="${v.imageUrl}" alt="${v.title}" class="w-full h-44 object-cover"><span class="absolute bottom-2 right-2 bg-black/80 text-white text-xs px-2 py-1 rounded">${v.duration}</span></div><div class="p-4"><h3 class="font-serif font-bold text-gray-900 dark:text-white">${v.title}</h3><p class="text-xs text-gray-500 mt-2">${v.newspaper} · ${v.views} · ${v.date}</p></div></div>`).join('')}
          </div>
        </div>`;
    }

    function renderNewspaper() {
      const newspaper = state.activeNewspaper || NEWSPAPERS[0];
      const articles = getNewspaperArticles(newspaper);
      const featured = articles[0];
      const secondary = articles.slice(1, 3);
      const editionLabel = newspaper.toUpperCase();

      return `
        <div class="flex flex-col h-full bg-[#f5f6f8] dark:bg-gray-900 overflow-y-auto pb-24 no-scrollbar">
          <header class="sticky top-0 z-30 bg-white dark:bg-gray-900 border-b border-gray-200 dark:border-gray-800">
            <div class="pt-10 px-5 pb-4 flex items-center gap-3">
              <button onclick="window.goBack()" class="p-1 text-gray-600 dark:text-gray-300" aria-label="Regresar">
                <i data-lucide="chevron-left" class="w-6 h-6"></i>
              </button>
              <div>
                <p class="text-[10px] tracking-widest font-semibold text-gray-500 dark:text-gray-400">EDICIÓN DIGITAL</p>
                <h1 class="font-serif text-xl font-bold text-gray-900 dark:text-white">${newspaper}</h1>
              </div>
            </div>
          </header>

          <section class="bg-[#f1f2f5] dark:bg-gray-800 px-5 pt-7 pb-8 text-center border-b-4 border-orange-600">
            <h2 class="font-serif text-4xl sm:text-5xl font-bold leading-tight text-slate-950 dark:text-white">${newspaper}</h2>
            <p class="font-serif italic text-base text-gray-600 dark:text-gray-300 mt-2">Información, actualidad y noticias de tu región</p>
          </section>

          <main class="px-4 sm:px-6 py-7">
            ${featured ? `
              <article onclick="window.goToArticle(${featured.id})" class="cursor-pointer group mb-7">
                <div class="rounded-2xl overflow-hidden h-52 sm:h-64 bg-gray-200 dark:bg-gray-800">
                  <img src="${featured.imageUrl}" alt="${featured.title}" class="w-full h-full object-cover group-hover:scale-105 transition-transform duration-500">
                </div>
                <div class="mt-5">
                  <div class="flex items-center gap-2 text-xs mb-2">
                    <span class="font-semibold tracking-wide text-orange-600">${featured.category.toUpperCase()}</span>
                    <span class="text-gray-400">•</span>
                    <span class="text-gray-500 dark:text-gray-400">${newspaper}</span>
                  </div>
                  <h3 class="font-serif text-2xl sm:text-3xl font-bold leading-tight text-slate-950 dark:text-white">${featured.title}</h3>
                  <p class="mt-3 text-base leading-relaxed text-gray-600 dark:text-gray-300">${featured.excerpt}</p>
                </div>
              </article>
            ` : ''}

            <div class="space-y-5">
              ${secondary.map(article => `
                <article onclick="window.goToArticle(${article.id})" class="cursor-pointer group flex gap-4 border-t border-gray-200 dark:border-gray-700 pt-4">
                  <div class="w-32 h-24 sm:w-36 sm:h-28 flex-shrink-0 rounded-xl overflow-hidden bg-gray-200 dark:bg-gray-800">
                    <img src="${article.imageUrl}" alt="${article.title}" class="w-full h-full object-cover group-hover:scale-105 transition-transform duration-500">
                  </div>
                  <div class="min-w-0">
                    <div class="flex items-center gap-2 text-[11px] mb-1">
                      <span class="font-semibold tracking-wide text-orange-600">${article.category.toUpperCase()}</span>
                      <span class="text-gray-400">•</span>
                      <span class="text-gray-500 dark:text-gray-400">${newspaper}</span>
                    </div>
                    <h4 class="font-serif text-lg font-bold leading-tight text-slate-950 dark:text-white">${article.title}</h4>
                    <p class="text-xs text-gray-500 dark:text-gray-400 mt-2">${article.date}</p>
                  </div>
                </article>
              `).join('')}
            </div>

            <div class="mt-8 border-t border-gray-200 dark:border-gray-700 pt-5">
              <div class="flex items-center justify-between mb-4">
                <h3 class="font-serif text-xl font-bold text-gray-900 dark:text-white">Más noticias</h3>
                <span class="text-xs text-gray-500 dark:text-gray-400">${articles.length} notas</span>
              </div>
              <div class="space-y-4">
                ${articles.slice(3).map(article => `
                  <article onclick="window.goToArticle(${article.id})" class="cursor-pointer border-b border-gray-200 dark:border-gray-700 pb-4">
                    <div class="text-[11px] text-orange-600 font-semibold uppercase tracking-wide mb-1">${article.category}</div>
                    <h4 class="font-serif text-lg font-bold text-gray-900 dark:text-white">${article.title}</h4>
                    <p class="text-sm text-gray-500 dark:text-gray-400 mt-1">${article.excerpt}</p>
                  </article>
                `).join('')}
              </div>
            </div>
          </main>
        </div>`;
    }

    window.setSelectedTopics = (topics) => { state.selectedTopics = topics; renderApp(); };

    // --- OVERLAYS ---
    function renderBottomNav() {
      if (['login', 'register', 'onboarding', 'article'].includes(state.screen)) return '';
      
      const items = [
        { id: 'home', icon: 'home', label: 'Inicio' },
        { id: 'explore', icon: 'grid', label: 'Explorar' },
        { id: 'videos', icon: 'video', label: 'Videos' },
        { id: 'saved', icon: 'bookmark', label: 'Guardados', badge: state.savedArticles.length },
        { id: 'profile', icon: 'user', label: 'Perfil' },
      ];

      const buttons = items.map(item => {
        const isActive = state.screen === item.id || (state.screen === 'newspaper' && item.id === 'explore') || (['editions', 'corporate', 'settings'].includes(state.screen) && item.id === 'profile');
        const color = isActive ? 'text-orange-600 dark:text-orange-500' : 'text-gray-400 hover:text-gray-600';
        const fill = isActive && item.id !== 'profile' && item.id !== 'videos' ? 'fill-current' : '';
        const badge = item.badge > 0 && !isActive ? `<span class="absolute -top-1 -right-1 w-3 h-3 bg-red-500 border-2 border-white dark:border-gray-900 rounded-full"></span>` : '';
        
        return `
          <button onclick="window.navigate('${item.id}')" class="flex flex-col items-center justify-center w-full h-full space-y-1 transition-colors ${color}">
            <div class="relative">
              <i data-lucide="${item.icon}" class="w-6 h-6 ${fill}"></i>
              ${badge}
            </div>
            <span class="text-[10px] font-medium">${item.label}</span>
          </button>
        `;
      }).join('');

      return `
        <div class="absolute bottom-0 w-full bg-white/90 dark:bg-gray-900/90 backdrop-blur-lg border-t border-gray-200 dark:border-gray-800 pb-2 z-30 transition-colors duration-300">
          <div class="flex justify-around items-center h-16 px-2">
            ${buttons}
          </div>
        </div>
      `;
    }

    function renderAuthModal() {
      if (!state.authModal.show) return '';
      return `
        <div class="absolute inset-0 z-50 flex items-center justify-center bg-black/60 backdrop-blur-sm p-6 animate-fade-in">
          <div class="bg-white dark:bg-gray-900 rounded-3xl p-6 w-full max-w-sm shadow-2xl border border-gray-100 dark:border-gray-800 text-center relative">
            <button onclick="window.closeAuthModal()" class="absolute top-4 right-4 text-gray-400 hover:text-gray-600">
              <i data-lucide="x" class="w-5 h-5"></i>
            </button>
            <div class="w-16 h-16 bg-orange-100 dark:bg-orange-900/30 rounded-full flex items-center justify-center mx-auto mb-4 text-orange-600 dark:text-orange-500">
              <i data-lucide="lock" class="w-8 h-8"></i>
            </div>
            <h3 class="text-xl font-serif font-bold text-gray-900 dark:text-white mb-2">Función Restringida</h3>
            <p class="text-gray-600 dark:text-gray-400 text-sm mb-6 leading-relaxed">${state.authModal.message}</p>
            <div class="space-y-3">
              <button onclick="window.closeAuthModal(); window.clearHistoryAndNavigate('register')" class="w-full bg-orange-600 text-white font-semibold py-3 rounded-xl shadow-lg">Crear cuenta gratis</button>
              <button onclick="window.closeAuthModal(); window.handleLogout()" class="w-full bg-transparent border border-gray-300 dark:border-gray-700 text-gray-700 dark:text-gray-300 font-medium py-3 rounded-xl">Inicia sesión</button>
            </div>
          </div>
        </div>
      `;
    }

    function renderSettingsModal() {
      if (!state.showSettings) return '';
      const sizes = ['small', 'normal', 'large', 'xlarge'];
      const btns = sizes.map(size => `
        <button type="button" onclick="window.setFontSize('${size}', event)" class="flex-1 py-3 flex justify-center items-center rounded-lg transition-colors ${state.fontSize === size ? 'bg-white dark:bg-gray-700 shadow text-orange-600' : 'text-gray-500'}">
          <span class="${size === 'small' ? 'text-sm' : size === 'large' ? 'text-xl' : size === 'xlarge' ? 'text-2xl' : 'text-base'} font-serif font-bold">A</span>
        </button>
      `).join('');

      return `
        <div class="absolute inset-0 z-[100] pointer-events-auto" onclick="window.closeSettings(event)">
          <div class="absolute inset-0 bg-black/30" aria-hidden="true"></div>

          <div class="absolute bottom-0 left-0 right-0 bg-white dark:bg-gray-800 p-6 rounded-t-3xl shadow-[0_-10px_40px_rgba(0,0,0,0.25)] border-t border-gray-100 dark:border-gray-700 animate-slide-up"
               onclick="event.stopPropagation()">
            <div class="flex justify-between items-center mb-6">
              <h3 class="font-bold text-gray-900 dark:text-white">Tamaño de texto</h3>
              <button type="button" onclick="window.closeSettings(event)" class="text-gray-400 p-1">
                <i data-lucide="x" class="w-5 h-5"></i>
              </button>
            </div>

            <div class="flex justify-between bg-gray-100 dark:bg-gray-900 p-2 rounded-xl">
              ${btns}
            </div>
          </div>
        </div>
      `;
    }

    // --- MAIN RENDERER ---
    function renderApp() {
      const root = document.getElementById('screen-root');
      let html = '';

      switch(state.screen) {
        case 'login': html = renderLogin(); break;
        case 'register': html = renderRegister(); break;
        case 'onboarding': html = renderOnboarding(); break;
        case 'search': html = renderSearch(); break;
        case 'settings': html = renderSettingsScreen(); break;
        case 'home': html = renderHome(); break;
        case 'explore': html = renderExplore(); break;
        case 'videos': html = renderVideos(); break;
        case 'newspaper': html = renderNewspaper(); break;
        case 'article': html = renderArticle(); break;
        case 'saved': html = renderSaved(); break;
        case 'editions': html = renderEditions(); break;
        case 'corporate': html = renderCorporate(); break;
        case 'profile': html = renderProfile(); break;
      }

      root.innerHTML = html;
      document.getElementById('nav-root').innerHTML = renderBottomNav();
      document.getElementById('modal-root').innerHTML = renderAuthModal();
      document.getElementById('settings-root').innerHTML = renderSettingsModal();

      lucide.createIcons();
    }

    window.addEventListener('DOMContentLoaded', () => {
      updateThemeDOM();
      updateNightLightDOM();
      renderApp();
    });

  </script>
</body>
</html>
